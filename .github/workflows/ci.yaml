name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # The project lives in spike/ until the M0 reset moves it to the repository root;
        # then this becomes "." (and the paths in the steps below lose their spike/ prefix).
        working-directory: spike
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: spike/pom.xml

      # verify = compile + unit tests + Checkstyle + shaded jar
      - name: Build, test and lint
        run: mvn -B --no-transfer-progress verify

      - name: Smoke test the packaged jar
        shell: bash
        run: java -jar target/buildcli-spike-*.jar --help

      - name: Upload the jar
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: buildcli-spike-jar
          path: spike/target/buildcli-spike-*.jar
          retention-days: 7
