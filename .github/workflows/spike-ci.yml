name: Spike CI

on:
  push:
    paths: ["spike/**", ".github/workflows/spike-ci.yml"]
  pull_request:
    paths: ["spike/**", ".github/workflows/spike-ci.yml"]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test the spike
        run: mvn -f spike/pom.xml -B verify
